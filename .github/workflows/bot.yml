name: GorillaTag + Eldorado Sniper

on:
  schedule:
    - cron: '*/1 * * * *' # runs every minute
  workflow_dispatch:

jobs:
  sniper-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py requests playwright
          playwright install chromium

      - name: Run sniper bot
        run: xvfb-run -a python mega_sniper.py
